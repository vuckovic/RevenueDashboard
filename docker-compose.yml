# Revenue Dashboard v2 — start with:  docker compose up -d --build
# Secrets come from .env (git-ignored). See .env.example.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      POSTGRES_DB: ${PG_DB:-revenue}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-revenue}"]
      interval: 5s
      retries: 10

  web:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      PG_HOST: db
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      PG_HOST: db
    command: python worker.py
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
